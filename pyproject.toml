[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
    "mysql: integration tests requiring a MySQL 8.4 database from NOVEL_TEST_MYSQL_URL",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
