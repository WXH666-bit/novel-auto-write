services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --ngram-token-size=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: novel_auto_write
      MYSQL_USER: novelapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - novel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unovelapp", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  novel_mysql:
